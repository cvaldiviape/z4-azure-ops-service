server:
  port: 8085

spring:
  application:
    name: ops-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ops-dead-letter-consumer-group-id # Grupo propio: lee todos los DLT sin interferir con los consumers de negocio.
      auto-offset-reset: earliest # La primera vez guarda también los mensajes que ya estaban en los DLT.
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        metadata.max.age.ms: 30000 # Cada 30 s revisa si apareció un topic nuevo que coincida con el patrón *-dlt.
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record # Confirma el offset solo después de guardar el mensaje en la base de datos.

app:
  dead-letter:
    topic-pattern: ${DEAD_LETTER_TOPIC_PATTERN:.*-dlt} # Cualquier topic terminado en -dlt se guarda para revisarlo.
    store-retry-interval-milliseconds: ${DEAD_LETTER_STORE_RETRY_INTERVAL_MILLISECONDS:5000} # Si la BD no responde, reintenta sin perder el mensaje.
    replay-timeout-milliseconds: ${DEAD_LETTER_REPLAY_TIMEOUT_MILLISECONDS:10000}
  security: # Reglas de acceso que aplica z4-shared-security.
    public-paths: /actuator/health # Sin token.
    admin-paths: /ops/** # Solo token con rol ADMIN; el resto exige cualquier token válido.
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173} # Orígenes de los fronts en desarrollo.
  jwt:
    secret: ${JWT_SECRET:change-me-change-me-change-me-32-bytes}
